name: Build (CI)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
    build:
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      args: --linux AppImage
                      artifact: abs2kindle-appimage
                      path: dist/*.AppImage
                    - os: windows-latest
                      args: --win
                      artifact: abs2kindle-exe
                      path: dist/*.exe

        runs-on: ${{ matrix.os }}

        env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Cache electron
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/electron
                      ~/AppData/Local/electron/Cache
                  key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npx electron-builder ${{ matrix.args }} --publish never

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.artifact }}
                  path: ${{ matrix.path }}
                  if-no-files-found: error
                  retention-days: 14
